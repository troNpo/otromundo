name: Desplegar OtroMundo en GitHub Pages
on:
push:
branches: ["main"]
workflow_dispatch:
permissions:
contents: read
pages: write
id-token: write
concurrency:
group: "pages"
cancel-in-progress: false
jobs:
build-and-deploy:
environment:
name: github-pages
url: ${{ steps.deployment.outputs.page_url }}
runs-on: ubuntu-latest
steps:
- name: Descargar código del repositorio
uses: actions/checkout@v4
- name: Inyectar API Key de MapTiler en estilo JSON
env:
MAPTILER_KEY: ${{ secrets.MAPTILER_API_KEY }}
run: |
if [ -n "$MAPTILER_KEY" ] && [ -f "styles/otromundo.json" ]; then
sed -i "s/{{API_KEY}}/$MAPTILER_KEY/g" styles/otromundo.json
fi
- name: Configurar GitHub Pages
uses: actions/configure-pages@v5
- name: Empaquetar archivos para GitHub Pages
uses: actions/upload-pages-artifact@v3
with:
path: '.'
- name: Desplegar a GitHub Pages
id: deployment
uses: actions/deploy-pages@v4
