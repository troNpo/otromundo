name: Deploy PWA to GitHub Pages

on:
  push:
    branches:
      - main  # Cambia a 'master' si esa es tu rama principal

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Inyectar MapTiler API Key en los estilos JSON, HTML y JS
        run: |
          # Reemplaza {{API_KEY}} por la clave real de MapTiler guardada en GitHub Secrets
          find . -type f \( -name "*.json" -o -name "*.html" -o -name "*.js" \) -exec sed -i 's/{{API_KEY}}/${{ secrets.MAPTILER_API_KEY }}/g' {} +

      - name: Configurar Pages
        uses: actions/configure-pages@v4

      - name: Subir artefacto de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
